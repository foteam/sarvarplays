<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse Orbit</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; inset: 18px auto auto 18px; color: #e2e8f0; pointer-events: none; }
    .hud b { color: #22d3ee; }
    .hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); color: #94a3b8; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">SCORE <b id="s">0</b></div>
  <div class="hint">Click / tap to pulse</div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("s");
    let w, h, t = 0, score = 0, pulse = 0;
    const orbs = [];

    function resize() {
      w = canvas.width = innerWidth * devicePixelRatio;
      h = canvas.height = innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    addEventListener("resize", resize);
    resize();

    function spawn() {
      orbs.push({
        a: Math.random() * Math.PI * 2,
        r: 80 + Math.random() * Math.min(innerWidth, innerHeight) * 0.32,
        s: 0.004 + Math.random() * 0.01,
        size: 8 + Math.random() * 14,
        hue: 170 + Math.random() * 80
      });
    }
    for (let i = 0; i < 18; i++) spawn();

    function boom(x, y) {
      pulse = 1;
      const cx = innerWidth / 2, cy = innerHeight / 2;
      for (const o of orbs) {
        const px = cx + Math.cos(o.a + t) * o.r;
        const py = cy + Math.sin(o.a + t * 0.85) * o.r * 0.62;
        const d = Math.hypot(px - x, py - y);
        if (d < 90) {
          score += 10;
          o.a += Math.PI;
          o.hue += 40;
        }
      }
      scoreEl.textContent = score;
    }

    addEventListener("pointerdown", (e) => boom(e.clientX, e.clientY));

    function loop() {
      t += 0.016;
      pulse *= 0.9;
      ctx.fillStyle = "rgba(5,6,12,0.24)";
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      const cx = innerWidth / 2, cy = innerHeight / 2;
      const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, 280);
      g.addColorStop(0, `rgba(34,211,238,${0.18 + pulse * 0.35})`);
      g.addColorStop(1, "rgba(124,92,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, 240, 0, Math.PI * 2);
      ctx.fill();
      for (const o of orbs) {
        o.a += o.s;
        const x = cx + Math.cos(o.a + t) * o.r;
        const y = cy + Math.sin(o.a + t * 0.85) * o.r * 0.62;
        ctx.beginPath();
        ctx.fillStyle = `hsla(${o.hue}, 90%, 62%, .95)`;
        ctx.shadowColor = `hsla(${o.hue}, 90%, 62%, .8)`;
        ctx.shadowBlur = 18;
        ctx.arc(x, y, o.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
